[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tuberip"
version = "1.0.0"
description = "A modern PyQt6 frontend for yt-dlp"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyQt6>=6.6.0",
    "yt-dlp>=2026.7.4",
    "yt-dlp-ejs>=0.3.1",
]

[project.scripts]
tuberip = "tuberip.app:main"

[tool.setuptools.packages.find]
include = ["tuberip*"]

[tool.setuptools.package-data]
tuberip = ["assets/*"]
